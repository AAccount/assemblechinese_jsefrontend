name: Manual Java Workspace Build & Auto-Release

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [dependency_updated]

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down AssembleChinese JSE FrontEnd code into its own folder
      - name: Checkout JSEFrontEnd
        uses: actions/checkout@v4.2.2
        with:
          path: JSEFrontEnd
          fetch-depth: 0

      # 2. Pull down the IdsCore code into its own folder
      - name: Checkout IdsCore
        uses: actions/checkout@v4.2.2
        with:
          repository: AAccount/assemblechinese_idscore
          path: IdsCore
          fetch-depth: 0

      # 3. Set up the Java JDK
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21' 
          distribution: 'temurin'

      # 4. Gather all java files and compile them using all referenced libraries
      - name: Compile Java Code
        run: |
          mkdir -p bin
          
          # Find all .java files across both source directories
          find IdsCore/src JSEFrontEnd/src -name "*.java" > sources.txt
          
          # Build a dynamic classpath listing the SQLite jar and any secondary jars inside IdsCore/lib/
          # If IdsCore/lib doesn't exist yet, we create an empty one to prevent javac from throwing an error
          mkdir -p IdsCore/lib
          CLASSPATH=$(echo IdsCore/lib/*.jar IdsCore/sqlite-jdbc-3.53.2.0.jar | tr ' ' ':')
          
          javac -cp "$CLASSPATH" -d bin @sources.txt

      # 5. Extract the SQLite JAR into the bin folder for a standalone app
      - name: Extract Dependencies
        run: |
          cd bin
          jar -xf ../IdsCore/lib/sqlite-jdbc-3.53.2.0.jar
          # Remove the embedded manifest file so it doesn't overwrite your main one
          rm -rf META-INF/MANIFEST.MF

      # 6. Copy frontend font assets straight into the compilation runtime folder
      - name: Package Resource Fonts
        run: |
          # Replicates your "resources/fonts" folder structure inside the compiled classes path
          mkdir -p bin/resources/fonts
          
          # Safely copy the babel stone custom fonts into the compilation directory
          if [ -d "JSEFrontEnd/src/resources/fonts" ]; then
            cp -r JSEFrontEnd/src/resources/fonts/* bin/resources/fonts/
          fi

      # 7. Package everything into a single standalone JAR
      - name: Package JAR file
        run: |
          echo "Main-Class: dt.asm.App" > manifest.txt
          jar cfm AssembleChinese.jar manifest.txt -C bin .

      # 8. Create a custom sources zip file mirroring your workspace setup
      - name: Create Custom Sources Archive
        run: |
          mkdir -p combined_sources/JSEFrontEnd
          mkdir -p combined_sources/IdsCore
          
          cp -r JSEFrontEnd/src combined_sources/JSEFrontEnd/
          cp -r IdsCore/src combined_sources/IdsCore/
          
          cd combined_sources && zip -r ../sources.zip .

      # 9. Extract previous release info and compile cross-repo change logs
      - name: Generate Multi-Repo Release Notes
        id: notes_gen
        working-directory: JSEFrontEnd
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          CORE_HASH=$(git -C ../IdsCore rev-parse --short HEAD)
          
          echo "### 🔄 Combined Changelog" > ../changelog.md
          echo "Build Metadata:" >> ../changelog.md
          echo "* **IDS Core Commit:** \`$CORE_HASH\`" >> ../changelog.md
          
          echo -e "\n#### 🖥️ JSE FrontEnd Changes:" >> ../changelog.md
          if [ -z "$LATEST_TAG" ]; then
            git log --oneline -n 10 --pretty=format:"* %s (%an)" >> ../changelog.md
          else
            git log "$LATEST_TAG..HEAD" --pretty=format:"* %s (%an)" >> ../changelog.md || echo "* Minor maintenance tweaks" >> ../changelog.md
          fi
          
          echo -e "\n\n#### 🗃️ IDS Core Changes (Since Last Release):" >> ../changelog.md
          if [ -z "$LATEST_TAG" ]; then
            git -C ../IdsCore log --oneline -n 10 --pretty=format:"* %s (%an)" >> ../changelog.md
          else
            TAG_DATE=$(git log -1 --format=%ai "$LATEST_TAG")
            git -C ../IdsCore log --since="$TAG_DATE" --pretty=format:"* %s (%an)" >> ../changelog.md || echo "* No structural changes" >> ../changelog.md
          fi
          
          echo -e "\n\n### 📦 Download Assets" >> ../changelog.md
          echo "* **\`AssembleChinese.jar\`** - Fully compiled standalone application." >> ../changelog.md
          echo "* **\`sources.zip\`** - **[USE THIS FOR SOURCE CODE]** Contains the combined Java source code snapshots." >> ../changelog.md
          echo -e "\n⚠️ **CRITICAL WARNING:** Do *not* download the default \`Source code (.zip)\` links at the bottom of this page. They are missing the core system engines." >> ../changelog.md

      # 10. Create a unique Version Tag based on the exact date and time
      - name: Generate Release Tag
        id: tag_gen
        run: |
          TAG_NAME="build-$(date +'%Y.%m.%d-%H%M')"
          echo "generated_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      # 11. Create a GitHub Release and deploy artifacts
      - name: Deploy GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_gen.outputs.generated_tag }}
          name: "Automated Build: ${{ steps.tag_gen.outputs.generated_tag }}"
          body_path: changelog.md
          draft: false
          prerelease: false
          files: |
            AssembleChinese.jar
            sources.zip
